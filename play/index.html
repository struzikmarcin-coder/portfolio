  ebul.forEach(b=>{x.fillStyle=b.pen?'#ff4d4d':'#ff5fa2';x.fillRect(b.x-2,b.y-1,b.pen?5:3,b.pen?2:3);});
  bullets.forEach(b=>{x.fillStyle=b.c;x.fillRect(b.x,b.y,b.s+1,2);});
  if(!(invuln>0&&Math.floor(t*14)%2)){const run=P.ground&&Math.floor(P.f)%2;spr(x,run?'soldier2':'soldier',(P.x-4)|0,(P.y-15)|0);}
  particles.forEach(p=>{x.fillStyle=p.c;x.fillRect(p.x|0,p.y|0,2,2);});
  popups.forEach(p=>txt(p.txt,p.x,p.y,p.col,6));
  txt('1P',6,5,'#8dfba1',8);for(let i=0;i<lives;i++){x.fillStyle='#8dfba1';x.fillRect(26+i*7,6,5,7);}
  txt(String(score).padStart(6,'0'),6,17,'#fff',8);
  txt(weapon==='spread'?'AI SPREAD':'NORMAL',W-6,5,weapon==='spread'?'#8dfba1':'#9aa0a8',W<300?6:8,'right');
  txt(W<300?(state==='boss'?'THE COMMITTEE':'KICKOFF CALL'):(state==='boss'?'BOSS: THE COMMITTEE':'STAGE 1: THE KICKOFF CALL'),W/2,5,'#ffd166',6,'center');
  if(state==='play'&&t<4)txt('TAP / SPACE = JUMP · AUTO-FIRE',W/2,H-18,'#fff',6,'center');
 }else{
  txt('★ A GAME FOR MARKETERS ★',W/2,20,'#ff4d4d',7,'center');
  x.save();x.fillStyle='#ff4d4d';x.font=(W<300?20:28)+'px "Press Start 2P",monospace';x.textAlign='center';x.textBaseline='top';x.fillText('CUT FORCE',W/2+3,38+3);x.fillStyle='#ffd166';x.fillText('CUT FORCE',W/2,38);x.restore();
  txt('YOUR VIDEO vs. THE COMMITTEE',W/2,84,'#f4f5f6',7,'center');
  if(Math.floor(t*2)%2)txt('PRESS START / TAP',W/2,98,'#8dfba1',9,'center');
  txt('BY MARCIN STRUZIK',W/2,115,'#6b8afd',6,'center');txt('OG AFTER EFFECTS ANIMATOR. NOW WITH AI.',W/2,125,'#c9ced6',5,'center');
  spr(x,Math.floor(t*6)%2?'soldier':'soldier2',20,GY-15);spr(x,'suit',W-60,GY-15,true);}
}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);
 if(shake>0){x.save();x.translate(rnd(-1.5,1.5),rnd(-1.5,1.5));}
 draw();if(shake>0)x.restore();requestAnimationFrame(loop);}
reset();started=true;
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(loop));
window.__cf={get:()=>({state,dist,score,lives,weapon,stakes,boss:boss&&boss.tur.map(u=>u.hp).concat(boss.core.hp)}),start:()=>startGame()};
</script></body></html>
